<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Saved News - The Newsroom</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        /* =====================================================
           SAVED NEWS PAGE
        ===================================================== */

        body {
            margin: 0;
            background: #f5f5f5;
            color: #111;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        .saved-page {
            max-width: 1450px;
            margin: 0 auto;
            padding: 32px;
        }

        .saved-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .saved-header h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .saved-header p {
            margin: 8px 0 0;
            color: #666;
            font-size: 17px;
        }

        .saved-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .saved-button {
            border: 1px solid #111;
            background: #fff;
            color: #111;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .saved-button:hover {
            background: #111;
            color: #fff;
        }

        .saved-button.primary {
            background: #111;
            color: #fff;
        }

        .saved-button.primary:hover {
            background: #333;
        }

        .saved-button.danger:hover {
            background: #b00020;
            border-color: #b00020;
        }

        .saved-status {
            margin-bottom: 20px;
            font-size: 16px;
            color: #555;
        }

        .saved-grid {
            display: grid;
            gap: 24px;
        }

        .saved-card {
            background: #fff;
            border: 1px solid #d8d8d8;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
        }

        .saved-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: #666;
            font-size: 15px;
        }

        .saved-source {
            font-weight: 800;
            color: #222;
        }

        .saved-title {
            margin: 0 0 18px;
            font-size: 29px;
            line-height: 1.2;
            font-weight: 800;
        }

        .saved-description {
            margin: 0 0 24px;
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        .saved-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .saved-ai-panel {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 14px;
            background: #fafafa;
        }

        .saved-ai-panel.visible {
            display: block;
        }

        .saved-ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }

        .saved-ai-header h3 {
            margin: 0;
            font-size: 23px;
        }

        .ollama-badge {
            border: 1px solid #222;
            border-radius: 20px;
            padding: 7px 13px;
            font-size: 13px;
            font-weight: 700;
        }

        .ai-section {
            margin-top: 20px;
        }

        .ai-section h4 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .ai-section p {
            margin: 0;
            font-size: 16px;
            line-height: 1.6;
        }

        .ai-section ul {
            margin: 8px 0 0;
            padding-left: 24px;
        }

        .ai-section li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .ai-metrics {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .ai-metric {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
        }

        .ai-metric-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
            font-weight: 700;
        }

        .ai-metric-value {
            font-size: 22px;
            font-weight: 800;
        }

        .saved-empty {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 18px;
            padding: 60px 30px;
            text-align: center;
        }

        .saved-empty h2 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .saved-empty p {
            margin: 0;
            color: #666;
            font-size: 17px;
        }

        .saved-loading {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 18px;
            padding: 50px;
            text-align: center;
            font-size: 18px;
        }

        .saved-error {
            background: #fff;
            border: 1px solid #d33;
            border-radius: 18px;
            padding: 30px;
            color: #a00000;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #111;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 800px) {

            .saved-page {
                padding: 20px;
            }

            .saved-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .saved-header h1 {
                font-size: 34px;
            }

            .saved-card {
                padding: 22px;
            }

            .saved-title {
                font-size: 24px;
            }

            .saved-description {
                font-size: 16px;
            }

            .ai-metrics {
                grid-template-columns: 1fr;
            }

            .saved-ai-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <main class="saved-page">

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to The Newsroom
        </a>

        <header class="saved-header">

            <div>
                <h1>Saved News</h1>

                <p>
                    Your saved articles and AI intelligence
                </p>
            </div>

            <div class="saved-actions">

                <button
                    id="refresh-saved"
                    class="saved-button primary"
                    type="button"
                >
                    Refresh Saved News
                </button>

            </div>

        </header>

        <div
            id="saved-status"
            class="saved-status"
        >
            Loading saved news...
        </div>

        <section
            id="saved-container"
            class="saved-grid"
        >

            <div class="saved-loading">
                Loading saved news...
            </div>

        </section>

    </main>

    <script src="saved.js?v=2"></script>

</body>
</html>
